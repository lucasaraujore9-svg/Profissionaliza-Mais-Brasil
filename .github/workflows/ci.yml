name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch quando há push novo —
# economiza CI minutes sem perder cobertura.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Skip do db:apply-pending (não temos DB no CI) e do prisma generate
      # roda via postinstall.
      - name: Install deps
        env:
          # postinstall roda `prisma generate` — não precisa de DATABASE_URL.
          SKIP_PENDING_MIGRATIONS: "1"
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # QA-003/COD-002: build no CI pega rota/página quebrada e erro de RSC que
      # tsc não pega. SKIP_PENDING_MIGRATIONS evita tocar o banco (não há DB no
      # CI); DATABASE_URL dummy satisfaz a validação de env.ts na coleta de
      # page-data (páginas são force-dynamic → não conectam no build).
      - name: Build
        env:
          SKIP_PENDING_MIGRATIONS: "1"
          DATABASE_URL: "postgresql://gate:gate@localhost:5432/gate"
        run: npm run build

      # audit NÃO bloqueia de propósito: hoje a única HIGH de prod é o
      # nodemailer (SEG-007), risco aceito e SEM patch upstream disponível —
      # um gate bloqueante ficaria vermelho permanentemente. Mantido
      # informativo (visibilidade na PR) + Dependabot semanal (.github/
      # dependabot.yml) como radar ativo. Reavaliar quando nodemailer >=9.0.1
      # sair: aí dá para bloquear HIGH/CRITICAL NOVAS com allowlist. Vulns
      # aceitas documentadas em docs/SECURITY.md §5.
      - name: npm audit (informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
